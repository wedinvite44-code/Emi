<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tautan Tidak Valid — Eternal Manuscript</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --color-cream: #f5f0eb;
  --color-charcoal: #1a1a1a;
  --color-gold: #b8956a;
  --color-gold-light: #c9a96e;
  --color-text-muted: #6b6560;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font-serif);
  background: var(--color-cream);
  color: var(--color-charcoal);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-font-smoothing: antialiased;
}
.main {
  width: 100%;
  max-width: 420px;
  padding: 3rem 1.5rem 3rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.brand {
  text-align: center;
  margin-bottom: 2rem;
  animation: blurIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.brand .em {
  font-family: var(--font-serif);
  font-size: 1.6rem;
  font-weight: 400;
  letter-spacing: 0.2em;
  margin-bottom: 0.25rem;
}
.brand .sub {
  font-family: var(--font-serif);
  font-size: 0.55rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--color-text-muted);
}
.auth-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1.5px solid var(--color-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.5rem;
  color: var(--color-gold);
  animation: blurIn 0.8s 0.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}
.auth-icon svg { width: 24px; height: 24px; }
.heading {
  text-align: center;
  margin-bottom: 0.5rem;
  animation: blurIn 0.8s 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}
.heading h1 {
  font-family: var(--font-serif);
  font-size: 1.8rem;
  font-weight: 400;
  line-height: 1.3;
}
.subheading {
  text-align: center;
  font-family: var(--font-serif);
  font-size: 1rem;
  color: var(--color-text-muted);
  margin-bottom: 2.5rem;
  animation: blurIn 0.8s 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}
.info-card {
  width: 100%;
  background: rgba(255,255,255,0.4);
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 16px;
  padding: 2rem 1.5rem;
  text-align: center;
  animation: blurIn 0.8s 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}
.info-card p {
  font-family: var(--font-serif);
  font-size: 1rem;
  line-height: 1.7;
  color: var(--color-charcoal);
}
.new-link {
  display: block;
  text-align: center;
  margin-top: 2rem;
  font-family: var(--font-serif);
  font-size: 1rem;
  color: var(--color-gold);
  text-decoration: none;
  transition: color 0.3s ease;
  animation: blurIn 0.8s 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}
.new-link:hover { color: var(--color-gold-light); }

@keyframes blurIn {
  0% { opacity: 0; filter: blur(10px); transform: translateY(8px); }
  100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
}
@media (min-width: 640px) {
  .main { padding-top: 4rem; }
  .info-card { padding: 2.5rem 2rem; }
}
</style>
</head>
<body>
<main class="main">
  <div class="brand">
    <div class="em">E · M</div>
    <div class="sub">Eternal Manuscript</div>
  </div>

  <div class="auth-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
  </div>

  <div class="heading"><h1>Tautan tidak valid</h1></div>
  <div class="subheading">Tautan atur ulang kata sandi hilang atau tidak valid</div>

  <div class="info-card">
    <p>Tautan yang Anda gunakan tampaknya tidak lengkap.<br>Silakan minta email atur ulang kata sandi yang baru.</p>
  </div>

  <a href="forgot-password.html" class="new-link">Minta tautan baru</a>
</main>
</body>
</html>
