<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Password Baru — Eternal Manuscript</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --color-cream: #f5f0eb;
  --color-charcoal: #1a1a1a;
  --color-dark-green: #1a1f1c;
  --color-gold: #b8956a;
  --color-gold-light: #c9a96e;
  --color-text-muted: #6b6560;
  --color-text-light: #9a948e;
  --font-serif: 'Cormorant Garamond', Georgia, serif;
  }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: var(--font-serif);
  background: var(--color-cream);
  color: var(--color-charcoal);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  -webkit-font-smoothing: antialiased;
}
.main {
  width: 100%;
  max-width: 420px;
  padding: 3rem 1.5rem 3rem;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.brand {
  text-align: center;
  margin-bottom: 2rem;
  animation: blurIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) forwards;
}
.brand .em {
  font-family: var(--font-serif);
  font-size: 1.6rem;
  font-weight: 400;
  letter-spacing: 0.2em;
  margin-bottom: 0.25rem;
}
.brand .sub {
  font-family: var(--font-serif);
  font-size: 0.55rem;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--color-text-muted);
}
.auth-icon {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  border: 1.5px solid var(--color-gold);
  display: flex;
  align-items: center;
  justify-content: center;
  margin-bottom: 1.5rem;
  color: var(--color-gold);
  animation: blurIn 0.8s 0.1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}
.auth-icon svg { width: 24px; height: 24px; }
.heading {
  text-align: center;
  margin-bottom: 0.5rem;
  animation: blurIn 0.8s 0.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}
.heading h1 {
  font-family: var(--font-serif);
  font-size: 1.6rem;
  font-weight: 400;
  line-height: 1.3;
}
.subheading {
  text-align: center;
  font-family: var(--font-serif);
  font-size: 1rem;
  color: var(--color-text-muted);
  margin-bottom: 2rem;
  animation: blurIn 0.8s 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}
.form-card {
  width: 100%;
  background: rgba(255,255,255,0.4);
  border: 1px solid rgba(0,0,0,0.06);
  border-radius: 16px;
  padding: 1.5rem;
  animation: blurIn 0.8s 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}
.form-group { margin-bottom: 1.1rem; }
.form-group label {
  display: block;
  font-family: var(--font-serif);
  font-size: 0.6rem;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--color-text-muted);
  margin-bottom: 0.5rem;
}
.input-wrap {
  position: relative;
  display: flex;
  align-items: center;
}
.input-wrap .icon {
  position: absolute;
  left: 0.9rem;
  color: var(--color-text-light);
  display: flex;
}
.input-wrap .icon svg { width: 18px; height: 18px; }
.input-wrap input {
  width: 100%;
  padding: 0.85rem 0.9rem 0.85rem 2.6rem;
  background: transparent;
  border: 1.5px solid rgba(0,0,0,0.1);
  border-radius: 10px;
  font-family: var(--font-serif);
  font-size: 0.95rem;
  color: var(--color-charcoal);
  outline: none;
  transition: all 0.3s ease;
}
.input-wrap input:focus {
  border-color: var(--color-gold);
  box-shadow: 0 0 0 3px rgba(184,149,106,0.1);
}
.input-wrap input::placeholder {
  color: var(--color-text-light);
  font-style: italic;
}
.submit-btn {
  width: 100%;
  padding: 0.95rem;
  background: var(--color-dark-green);
  color: var(--color-cream);
  border: none;
  border-radius: 10px;
  font-family: var(--font-serif);
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  cursor: pointer;
  transition: all 0.4s ease;
  margin-top: 0.5rem;
}
.submit-btn:hover {
  background: var(--color-charcoal);
  transform: translateY(-1px);
}
.back-link {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  margin-top: 2rem;
  font-family: var(--font-serif);
  font-size: 0.95rem;
  color: var(--color-gold);
  text-decoration: none;
  transition: color 0.3s ease;
  animation: blurIn 0.8s 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  opacity: 0;
}
.back-link:hover { color: var(--color-gold-light); }
.back-link svg { width: 16px; height: 16px; }

@keyframes blurIn {
  0% { opacity: 0; filter: blur(10px); transform: translateY(8px); }
  100% { opacity: 1; filter: blur(0px); transform: translateY(0); }
}
@media (min-width: 640px) {
  .main { padding-top: 4rem; }
  .form-card { padding: 2rem; }
}
</style>
</head>
<body>
<main class="main">
  <div class="brand">
    <div class="em">E · M</div>
    <div class="sub">Eternal Manuscript</div>
  </div>

  <div class="auth-icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
  </div>

  <div class="heading"><h1>Buat kata sandi baru</h1></div>
  <div class="subheading">Masukkan kata sandi baru untuk akun Anda</div>

  <div class="form-card">
    <form onsubmit="event.preventDefault(); handleReset();">
      <div class="form-group">
        <label>Kata Sandi Baru</label>
        <div class="input-wrap">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
          <input type="password" id="new-pass" placeholder="••••••••" required>
        </div>
      </div>
      <div class="form-group">
        <label>Konfirmasi Kata Sandi</label>
        <div class="input-wrap">
          <span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg></span>
          <input type="password" id="confirm-pass" placeholder="••••••••" required>
        </div>
      </div>
      <button type="submit" class="submit-btn">Simpan kata sandi</button>
    </form>
  </div>

  <a href="auth.html" class="back-link">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
    Kembali ke masuk
  </a>
</main>

<script>
function handleReset() {
  const p1 = document.getElementById('new-pass').value;
  const p2 = document.getElementById('confirm-pass').value;
  if (p1 !== p2) {
    alert('Kata sandi tidak cocok. Silakan coba lagi.');
    return;
  }
  alert('Kata sandi berhasil diperbarui. Silakan masuk dengan kata sandi baru Anda.');
  window.location.href = 'auth.html';
}
</script>
</body>
</html>
